<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMG Studio – Méthode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="methode.css">
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="brand">
        <span class="brand__logo">JUNIA</span>
        <span class="brand__sep" aria-hidden="true">/</span>
        <div class="brand__text">
          <strong>EMG Studio</strong>
          <span data-i18n="subtitle">Projet 4031 · Reconnaissance des mouvements</span>
        </div>
      </div>

      <div class="header__tools">
        <span class="pill" data-i18n="channels">EMG / 8 canaux</span>
        <div class="lang" role="group" aria-label="Langue">
          <button type="button" class="lang__btn" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" class="lang__btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="main">
      <ol class="stepper" aria-label="Étapes">
        <li class="step step--done">
          <span class="step__circle step__circle--done" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span><span data-i18n="step1">Import</span>
        </li>
        <li class="step__line step__line--done" aria-hidden="true"></li>
        <li class="step step--active" aria-current="step">
          <span class="step__circle">2</span><span data-i18n="step2">Méthode</span>
        </li>
        <li class="step__line step__line--done" aria-hidden="true"></li>
        <li class="step">
          <span class="step__circle">3</span><span data-i18n="step3">Visualisation</span>
        </li>
      </ol>

      <section class="content content--methods">
        <h1 class="title title--center" id="title" data-i18n="title">Choisissez votre méthode de reconnaissance</h1>
        <p class="lead lead--center" id="fileCount" aria-live="polite"></p>

        <div class="methods" role="radiogroup" aria-labelledby="title">
          <label class="method">
            <input class="method__input" type="radio" name="method" value="lstm">
            <span class="method__body">
              <span class="method__check" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="18" height="18"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="method__name">LSTM</span>
              <span class="method__full" data-i18n="lstmFull">Long Short-Term Memory</span>
              <span class="method__desc" data-i18n="lstmDesc">Réseau de neurones qui analyse l’évolution du signal dans le temps. Précis pour les gestes complexes, mais plus lourd et gourmand en données.</span>
              <span class="method__tag" data-i18n="lstmTag">Conseillé pour : grand jeu de données et gestes complexes</span>
            </span>
          </label>

          <label class="method">
            <input class="method__input" type="radio" name="method" value="knn">
            <span class="method__body">
              <span class="method__check" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="18" height="18"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <span class="method__name">KNN</span>
              <span class="method__full" data-i18n="knnFull">K plus proches voisins</span>
              <span class="method__desc" data-i18n="knnDesc">Classe un geste en le comparant à ses voisins les plus proches. Simple et rapide, idéal avec peu de données.</span>
              <span class="method__tag" data-i18n="knnTag">Conseillé pour : faible jeu de données et gestes simples</span>
            </span>
          </label>
        </div>

        <div class="actions">
          <button type="button" class="btn btn--outline" id="backBtn" data-i18n="back">Retour</button>
          <button type="button" class="btn btn--primary" id="validateBtn" disabled>
            <span data-i18n="validate">Valider</span> <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>JUNIA · Projet 4031 · 2026</span>
      <span data-i18n="disclaimer">Interface de recherche — pas un dispositif médical</span>
    </footer>
  </div>

  <script src="storage.js"></script>
  <script src="methode.js"></script>
</body>
</html>
