<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMG Studio – Analyse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chargement.css">
</head>
<body>
  <div class="page">

    <header class="header">
      <div class="brand">
        <span class="brand__logo">JUNIA</span>
        <span class="brand__sep" aria-hidden="true">/</span>
        <div class="brand__text">
          <strong>EMG Studio</strong>
          <span data-i18n="subtitle">Projet 4031 · Reconnaissance des mouvements</span>
        </div>
      </div>

      <div class="header__tools">
        <span class="pill" data-i18n="channels">EMG / 8 canaux</span>
        <div class="lang" role="group" aria-label="Langue">
          <button type="button" class="lang__btn" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" class="lang__btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="main">
      <ol class="stepper" aria-label="Étapes">
        <li class="step step--done">
          <span class="step__circle step__circle--done" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span><span data-i18n="step1">Import</span>
        </li>
        <li class="step__line step__line--done" aria-hidden="true"></li>
        <li class="step step--done">
          <span class="step__circle step__circle--done" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span><span data-i18n="step2">Méthode</span>
        </li>
        <li class="step__line step__line--done" aria-hidden="true"></li>
        <li class="step step--active" aria-current="step">
          <span class="step__circle">3</span><span data-i18n="step3">Visualisation</span>
        </li>
      </ol>

      <section class="content content--loading">
        <h1 class="title" id="title" data-i18n="title">Analyse en cours</h1>
        <p class="lead" id="lead" aria-live="polite"></p>
        <p class="error" id="error" role="alert" hidden></p>

        <div class="card loader">
          <div class="loader__head">
            <span id="barLabel" data-i18n="barLabel">Analyse des signaux</span>
            <span class="loader__percent" id="percent">0 %</span>
          </div>

          <div class="progress" id="progress" role="progressbar" aria-labelledby="barLabel"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress__bar" id="progressBar"></div>
          </div>

          <ul class="stages" id="stages"></ul>
        </div>

        <div class="actions actions--center">
          <button type="button" class="btn btn--outline" id="cancelBtn" data-i18n="cancel">Annuler</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>JUNIA · Projet 4031 · 2026</span>
      <span data-i18n="disclaimer">Interface de recherche — pas un dispositif médical</span>
    </footer>
  </div>

  <script src="storage.js"></script>
  <script src="chargement.js"></script>
</body>
</html>
